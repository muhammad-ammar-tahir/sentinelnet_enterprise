version: "3.9"

services:

  postgres:
    image: postgres:15-alpine
    container_name: sentinelnet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelnet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinelnet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelnet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinelnet_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    container_name: sentinelnet_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentinelnet_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Must use postgresql+asyncpg:// for async SQLAlchemy driver
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/sentinelnet
      DATABASE_URL_SYNC: postgresql://postgres:postgres@postgres:5432/sentinelnet
      # Controller and observability network topology bindings
      RYU_BASE_URL: http://host.docker.internal:8080
      PROMETHEUS_URL: http://prometheus:9090
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head &&
             python -m backend.database.seed &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: sentinelnet_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_WS_URL: ws://localhost:8000/ws
      VITE_DEMO_MODE: "false"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
