<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SHADER_START:ANIMATION_2 class="fixed inset-0 w-full h-full" -->
<div class="fixed inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_2" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_2');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec2 u_mouse;

// Hash and noise utilities
float hash(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

vec2 hash2(vec2 p) {
    float n = sin(dot(p, vec2(127.1, 311.7)));
    return fract(vec2(269.5, 183.3) * n);
}

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    vec2 p = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    
    // Background gradient (#0B1120 to #111827) with slight blue/cyan depth
    vec3 col1 = vec3(0.043, 0.067, 0.125); // #0B1120
    vec3 col2 = vec3(0.067, 0.094, 0.153); // #111827
    vec3 col = mix(col1, col2, uv.y + uv.x * 0.2);

    // Subtle ambient network glow
    float radial = length(p - vec2(-0.3, 0.1));
    col += vec3(0.02, 0.08, 0.07) * exp(-radial * 1.2);

    // Network grid coordinates
    vec2 gridUv = p * 3.5 + vec2(u_time * 0.03, sin(u_time * 0.02) * 0.1);
    vec2 i = floor(gridUv);
    vec2 f = fract(gridUv);

    float minDist = 1.0;
    vec2 closestNode = vec2(0.0);
    vec2 currentPos = vec2(0.0);

    // Voronoi / Delaunay-style dynamic connected nodes
    for (int y = -1; y <= 1; y++) {
        for (int x = -1; x <= 1; x++) {
            vec2 neighbor = vec2(float(x), float(y));
            vec2 point = hash2(i + neighbor);
            point = 0.5 + 0.4 * sin(u_time * 0.4 + 6.2831 * point);
            vec2 diff = neighbor + point - f;
            float dist = length(diff);
            if (dist < minDist) {
                minDist = dist;
                closestNode = neighbor + point;
            }
        }
    }

    // Node glow
    float nodeDot = smoothstep(0.06, 0.01, minDist);
    float nodeGlow = 0.02 / (minDist + 0.05);

    // Edge lines connecting nodes
    float edge = 0.0;
    for (int y = -1; y <= 1; y++) {
        for (int x = -1; x <= 1; x++) {
            vec2 neighbor = vec2(float(x), float(y));
            vec2 point = hash2(i + neighbor);
            point = 0.5 + 0.4 * sin(u_time * 0.4 + 6.2831 * point);
            vec2 diff = neighbor + point - f;
            
            // Connection to closest
            vec2 toClosest = closestNode - (neighbor + point);
            float dBetween = length(toClosest);
            if (dBetween > 0.01 && dBetween < 1.45) {
                // Line segment distance
                vec2 pa = f - (neighbor + point);
                vec2 ba = toClosest;
                float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
                float lineDist = length(pa - ba * h);
                
                // Pulse along connection line
                float pulse = sin(u_time * 1.5 - h * 6.28 + hash(i + neighbor) * 10.0) * 0.5 + 0.5;
                edge += (0.0035 / (lineDist + 0.02)) * (0.3 + 0.7 * pulse);
            }
        }
    }

    // Color mixing: Emerald (#10B981), Cyan (#06B6D4), Mint (#6EE7B7)
    vec3 emerald = vec3(0.063, 0.725, 0.506);
    vec3 cyan = vec3(0.024, 0.714, 0.831);
    vec3 mint = vec3(0.431, 0.906, 0.718);

    col += emerald * (nodeDot * 1.5 + nodeGlow * 0.35);
    col += mix(emerald, cyan, sin(u_time + p.x) * 0.5 + 0.5) * edge * 0.55;

    // Subtle traveling data packets
    float particles = 0.0;
    for(int k=0; k<6; k++) {
        float fi = float(k);
        vec2 partPos = vec2(sin(u_time * 0.2 + fi * 1.3) * 1.2, cos(u_time * 0.25 + fi * 1.7) * 0.8);
        float pDist = length(p - partPos);
        particles += 0.008 / (pDist * pDist + 0.01);
    }
    col += mint * particles * 0.15;

    // Gentle vignette
    col *= 1.0 - 0.35 * length(uv - 0.5);

    gl_FragColor = vec4(col, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
</div>
<!-- STITCH_SHADER_END:ANIMATION_2 -->
</body>
</html>
